<html>
  <head>
    <title>Code Editor</title>
    <style>
        *{
              margin: 0;
              padding: 0;
              FONT-FAMILY: sans-serif;
        }
        body {
           width: 100%;
           height: 100%;
           display: flex;
           background-color: yellow;
        }
        .leftpart {
           flex-basis: 50%;
           height: 100%;
           gap: 10px;
           background-color: aqua;
           display: flex;
           flex-direction: column;
        }
        .content {
           flex-basis: 33.33%;
           height: 100%;
           background-color: blue;
           
        }
        .rightpart {
           flex-basis: 50%;
           background-color: purple;
           height: 100%;
       }
         .leftpart .content textarea {
           width: 100%;
           height: calc(100% - 20px);  
           padding: 10px;
           background-color: black;
           color: white;
           border: none;
           outline: none;

         }
         .leftpart .content label {
           display: block;
           padding: 10px;
           background-color: black;
           color: white;
         }
         rightpart label {
           display: block;
           padding: 10px;
           background-color: black;
           color: white;
         }
         .rightpart iframe {
           width: 100%;
          display: block;
           height: 90%;
           border: 1px solid red;
           box-sizing: border-box;

         }


    </style>
  </head>
  <body>
  <div class="leftpart">
    <div class="content">
      <label>HTML</label> 
      <textarea></textarea>
    </div>
    <div class="content">
      <label>CSS</label> 
      <textarea></textarea>
      </div>
    <div class="content">
       <label>JSS</label> 
      <textarea></textarea></div>
    </div>
  </div>

  <!-- --------- -->

   <div class="rightpart">
    <label>Output</label>
    <iframe></iframe>
     
  </body>
</html>
